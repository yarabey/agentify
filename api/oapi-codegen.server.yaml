# Конфигурация oapi-codegen (v2.4.1): генерация серверного интерфейса (chi) из контракта.
#
# Назначение (бизнес): зафиксировать серверный контракт оркестратора так, чтобы
# реализация хендлеров проверялась компилятором против api/openapi.yaml
# (AGENTS.md §0 п.5). Роутер — chi (docs/01_tech_stack_and_architecture.md §3).
#
# Как устроено (тех): генерим только ServerInterface + регистрацию маршрутов
# (chi-server). Типы моделей идут из types.gen.go (тот же пакет `api`), поэтому
# здесь models отключены, чтобы не плодить дубликаты.
#
# Отклонение: embedded-spec НЕ генерим намеренно. Он тянет github.com/getkin/
# kin-openapi для рантайм-валидации, а его актуальные версии требуют go >= 1.25,
# что несовместимо с системным golangci-lint v2.5.0 (собран под go 1.24). Спека
# и так лежит в api/openapi.yaml (источник правды); встраивать её в бинарь на
# этапе MVP не требуется. При необходимости вернуть — пересмотреть с go 1.25.
#
# ВНИМАНИЕ: пути заданы относительно КОРНЯ репозитория (запуск через `make generate`).
package: api
output: orchestrator/internal/api/server.gen.go
generate:
  chi-server: true
import-mapping: {}
