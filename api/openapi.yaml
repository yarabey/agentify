openapi: 3.1.0
info:
  title: Orchestrator API (единый API всех каналов)
  version: 0.1.0-mvp
  description: |
    Единый API оркестратора. Через него работают все каналы (web PWA, Telegram-бот).
    Машинный канал (агент ↔ оркестратор) идёт по WebSocket с аутентификацией по UUID
    и здесь описан только как точка подключения — формат сообщений см. docs/protocol.md.
    Трассировка требований: коды FR (A1, B2, E2…) и Gherkin-функции даны в описаниях.

servers:
  - url: https://api.example.com
    description: prod (заменить на свой домен)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Регистрация, логин, токены (FR A1–A3, Gherkin §1)
  - name: admin
    description: Администрирование (FR A2)
  - name: integrations
    description: Интеграции и машины (FR B1–B6, Gherkin §2)
  - name: tasks
    description: Жизненный цикл задачи (FR E, F, H; Gherkin §4–§10)
  - name: channels
    description: Привязка каналов, напр. Telegram (FR D3)
  - name: machine
    description: Точка подключения агента (WebSocket, auth по UUID)
  - name: web
    description: Точка подключения браузера (WebSocket, auth по access-токену)

paths:
  /healthz:
    get:
      summary: Health-check
      security: []
      responses:
        "200": { description: OK }

  # ---------- AUTH (FR A1–A3, Gherkin §1) ----------
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Регистрация по токену регистрации
      description: |
        Создаёт аккаунт только при валидном токене регистрации (FR A1).
        Без/невалидный токен → 403 (Gherkin §1 «Регистрация без токена запрещена»).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Аккаунт создан }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Имя пользователя занято }

  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Логин
      description: Выдаёт access (JWT, короткоживущий) и refresh (непрозрачный). FR A3.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Токены выданы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Обновление токенов
      description: Меняет валидный refresh на новую пару (ротация refresh). FR A3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход (отзыв refresh)
      description: Отзывает refresh-токен. FR A3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Выполнено }

  # ---------- ADMIN (FR A2) ----------
  /admin/registration-token:
    get:
      tags: [admin]
      summary: Показать действующий токен регистрации
      description: Доступно только администратору (FR A2, Gherkin §1 «Администратор видит токен»).
      responses:
        "200":
          description: Действующий токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------- INTEGRATIONS (FR B1–B6, Gherkin §2) ----------
  /integrations:
    get:
      tags: [integrations]
      summary: Список интеграций пользователя
      description: Только свои интеграции (FR A4, I3). Содержит статус онлайн/оффлайн (FR B4).
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Integration" }
    post:
      tags: [integrations]
      summary: Создать интеграцию (выдаёт UUID)
      description: |
        Обязательное имя, опциональный IP-хинт (FR B1). В ответе — секретный UUID,
        доступный пользователю для настройки машины (FR B2, Gherkin §2 «Создание выдаёт UUID»).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationCreate" }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationWithSecret" }

  /integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [integrations]
      summary: Получить интеграцию
      responses:
        "200":
          description: Интеграция
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationWithSecret" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [integrations]
      summary: Редактировать имя/IP
      description: Не прерывает активные задачи (FR B5, Gherkin §2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationUpdate" }
      responses:
        "200": { description: Обновлено }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [integrations]
      summary: Удалить интеграцию
      description: |
        При наличии активных задач требует подтверждения (?confirm=true) и корректно
        завершает/отменяет их (FR B5, Gherkin §2 «Удаление требует подтверждения»).
      parameters:
        - name: confirm
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Удалено }
        "409":
          description: Есть активные задачи, нужно подтверждение (confirm=true)

  # ---------- TASKS (FR E,F,H; Gherkin §4–§10) ----------
  /tasks:
    get:
      tags: [tasks]
      summary: История задач
      description: Состав записи — FR H1, Gherkin §10. Хранение бессрочно (FR I2).
      parameters:
        - name: integration_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      tags: [tasks]
      summary: Поставить задачу
      description: |
        Ставит задачу в очередь к машине (FR E1). Дедуп по заголовку Idempotency-Key
        (FR E7, Gherkin §4 «Защита от двойной отправки»). Если машина оффлайн — задача
        ждёт в очереди (FR E4, Gherkin §9).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Задача создана (status=queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "200":
          description: Идемпотентный повтор — возвращена уже созданная задача
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /tasks/{id}:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    get:
      tags: [tasks]
      summary: Карточка задачи
      responses:
        "200":
          description: Задача
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/events:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    get:
      tags: [tasks]
      summary: Журнал событий задачи
      description: Вопросы агента, ответы пользователя, согласования, смены статуса (FR H1, аудит F4).
      responses:
        "200":
          description: Упорядоченный журнал
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskEvent" }

  /tasks/{id}/answer:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [tasks]
      summary: Ответить на вопрос агента
      description: |
        Ответ привязывается к конкретному question_id (FR F2, Gherkin §5
        «Несколько вопросов сопоставляются корректно»). После ответа задача → running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, text]
              properties:
                question_id: { type: string, format: uuid }
                text: { type: string }
      responses:
        "202": { description: Ответ принят }

  /tasks/{id}/approve:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [tasks]
      summary: Согласовать/отклонить команду
      description: |
        Решение по запросу согласования команды вне allowlist (FR F3, Gherkin §5
        «Команда вне allowlist», «Отклонение команды»).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, decision]
              properties:
                request_id: { type: string, format: uuid }
                decision: { type: string, enum: [approve, reject] }
      responses:
        "202": { description: Решение принято }

  /tasks/{id}/cancel:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [tasks]
      summary: Отменить задачу
      description: |
        Команда отмены гарантированно доходит до машины, агент останавливается (FR E6,
        Gherkin §8). Приоритет — сохранность данных: критическая операция доводится
        до безопасного состояния, мгновенная остановка не гарантируется.
      responses:
        "202": { description: Отмена инициирована }

  /tasks/{id}/confirm:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [tasks]
      summary: Подтвердить завершение
      description: |
        Переводит задачу из awaiting_confirm в completed. ТОЛЬКО это действие закрывает
        задачу (FR E2, Gherkin §7 «Пользователь подтверждает завершение»).
      responses:
        "200": { description: Задача завершена }

  /tasks/{id}/reject:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [tasks]
      summary: Отклонить результат (на доработку)
      description: Из awaiting_confirm возвращает задачу в running (FR E2, Gherkin §7).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200": { description: Возвращена в работу }

  # ---------- CHANNELS (FR D3) ----------
  /channels/telegram/link-code:
    post:
      tags: [channels]
      summary: Сгенерировать код привязки Telegram
      description: |
        Web генерирует одноразовый код; пользователь отправляет /start <code> боту,
        который обменивает его на привязку (FR D3).
      responses:
        "201":
          description: Код создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expires_at: { type: string, format: date-time }

  /channels/telegram/link:
    post:
      tags: [channels]
      security: []
      summary: Обменять код привязки на привязку Telegram-аккаунта
      description: |
        Вызывается ботом (тикет 10.2) при обработке `/start <code>`: обменивает
        одноразовый код (выданный `POST /channels/telegram/link-code`, тикет 9.6) на
        привязку telegram_user_id ↔ user_id (FR D3, Gherkin §6). Без Bearer — в этой
        точке пользователь ещё не аутентифицирован в системе как web-клиент; вместо
        этого доказательством права на привязку служит сам одноразовый код —
        высокоэнтропийный, одноразовый, с ограниченным сроком жизни (та же модель
        доверия, что у registration_token в POST /auth/register). Код атомарно
        помечается использованным ТОЛЬКО при успешной привязке (одна транзакция) —
        на любой ошибке код остаётся в прежнем состоянии (кроме случаев, когда сама
        ошибка — «код уже использован» или «код истёк»), т.е. неудачная попытка
        (например конфликт already-linked) не сжигает код впустую.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelLinkRequest" }
      responses:
        "200":
          description: Аккаунт привязан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelLink" }
        "400": { description: Некорректное тело запроса }
        "404": { description: Код привязки не найден }
        "409":
          description: >
            Код уже использован, истёк, либо этот telegram_user_id уже привязан к
            другому аккаунту — см. поле code в теле ошибки.

  /channels/telegram/token:
    post:
      tags: [channels]
      security: []
      summary: Обменять telegram_user_id на короткоживущий acting-токен (внутренний, только для бота)
      description: |
        Действия из Telegram — постановка/отмена задачи, ответ на вопрос агента
        (тикет 10.3, FR D1, §4 «Постановка задачи из канала») — должны выполняться
        через ТОТ ЖЕ REST API, что и web (принцип «единый API»,
        docs/01_tech_stack_and_architecture.md). У бота нет пользовательского
        access-JWT (только telegram_user_id отправителя апдейта), поэтому вместо
        Bearer этот эндпоинт аутентифицируется общим сервисным секретом в
        заголовке X-Bot-Service-Secret (ORCH_BOT_SERVICE_SECRET у оркестратора,
        BOT_SERVICE_SECRET у бота — одно и то же значение, известное только двум
        сервисам; см. docs/MANUAL_STEPS.md). Это доверенный внутренний канал:
        оркестратор доступен боту напрямую внутри docker compose-сети
        (BOT_ORCHESTRATOR_URL, тикет 10.2), минуя Caddy и публичный интернет.
        При валидном секрете telegram_user_id резолвится в user_id через
        channel_links (FR D3, тикет 10.2) и выпускается ОБЫЧНЫЙ access-JWT (тот
        же формат/TTL, что и POST /auth/login, FR A3). Дальше бот выполняет
        постановку/отмену задачи и ответ на вопрос ЧЕРЕЗ ОБЫЧНЫЕ защищённые
        операции контракта (POST /tasks, /tasks/{id}/cancel, /tasks/{id}/answer,
        GET /integrations) с этим токеном как Bearer — у оркестратора нет и не
        появляется отдельного пути постановки задачи «для Telegram».
        telegram_user_id, не привязанный ни к одному аккаунту (пользователь ещё
        не выполнил `/start <code>`), → 404: бот отвечает пользователю подсказкой
        привязать аккаунт (см. bot/README.md).
      parameters:
        - name: X-Bot-Service-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramActingTokenRequest" }
      responses:
        "200":
          description: Acting-токен выдан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramActingToken" }
        "400": { description: Некорректное тело запроса }
        "401": { description: Неверный/отсутствующий X-Bot-Service-Secret }
        "404": { description: telegram_user_id не привязан ни к одному аккаунту }

  # ---------- MACHINE (WebSocket, auth по UUID) ----------
  /machine/ws:
    get:
      tags: [machine]
      security: []
      summary: Точка подключения агента (WebSocket Upgrade)
      description: |
        Агент устанавливает исходящее WS-соединение и аутентифицируется по UUID интеграции
        (FR B3). Все команды/события идут асинхронно через шину (FR §7). Формат сообщений —
        docs/protocol.md. Это не обычный REST-эндпоинт.
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- WEB (WebSocket, auth по access-токену) ----------
  /ws:
    get:
      tags: [web]
      security: []
      summary: Точка подключения браузера (WebSocket Upgrade)
      description: |
        Открытая вкладка web держит исходящее WS-соединение к оркестратору и
        аутентифицируется по access-токену (FR G1). Уведомления (например, "агент
        задал вопрос") доставляются в открытую вкладку без перезагрузки страницы
        (§6 «Уведомление в web по WebSocket»). Формат сообщений — простой JSON,
        НЕ конверт машинного протокола docs/protocol.md; это не обычный
        REST-эндпоинт.
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ дедупликации постановки задачи (FR E7).
      schema: { type: string }

  responses:
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Запрещено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    RegisterRequest:
      type: object
      required: [registration_token, username, password]
      properties:
        registration_token: { type: string }
        username: { type: string }
        password: { type: string, format: password }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: TTL access-токена, сек }

    IntegrationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ip_hint: { type: string, nullable: true, description: Опциональная доп. проверка IP (FR B3) }

    IntegrationUpdate:
      type: object
      properties:
        name: { type: string }
        ip_hint: { type: string, nullable: true }

    Integration:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ip_hint: { type: string, nullable: true }
        status: { type: string, enum: [online, offline], description: FR B4 }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    IntegrationWithSecret:
      allOf:
        - $ref: "#/components/schemas/Integration"
        - type: object
          properties:
            uuid:
              type: string
              format: uuid
              description: Секрет для аутентификации машины (FR B2). Показывается владельцу.

    TaskStatus:
      type: string
      description: Статусы FSM, см. docs/Жизненный цикл задачи.md
      enum: [created, queued, running, waiting_user, awaiting_confirm, completed, failed, cancelled, stale]

    TaskCreate:
      type: object
      required: [integration_id, text]
      properties:
        integration_id: { type: string, format: uuid }
        text:
          type: string
          description: >-
            Текст запроса. Неизменяем после создания задачи (FR H3) — API для
            редактирования текста существующей задачи нет. Чтобы «исправить»
            уже отправленный запрос, нужно создать новую задачу отдельным
            POST /tasks (свой Idempotency-Key) — это отдельное действие
            («повтор»), не затрагивающее статус/журнал уже существующей задачи.

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        text:
          type: string
          description: Текст запроса на момент создания задачи; неизменяем (FR H3).
        status: { $ref: "#/components/schemas/TaskStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskEvent:
      type: object
      description: Элемент журнала задачи (FR H1, аудит F4)
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, description: Порядковый номер в рамках задачи }
        type:
          type: string
          enum: [status_change, agent_question, user_answer, command_approval_request, user_decision, agent_progress, agent_completed, error]
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    ChannelLinkRequest:
      type: object
      description: Тело POST /channels/telegram/link (FR D3, тикет 10.2).
      required: [code, telegram_user_id]
      properties:
        code:
          type: string
          description: Одноразовый код привязки из POST /channels/telegram/link-code (тикет 9.6).
        telegram_user_id:
          type: string
          description: >
            Telegram user id отправителя /start <code> (числовой id Telegram, передаётся
            строкой — channel_links.external_id хранит идентификатор как TEXT, канало-агностично).

    ChannelLink:
      type: object
      description: Привязка внешнего канала к аккаунту (FR D3).
      properties:
        channel: { type: string, enum: [telegram] }
        external_id: { type: string, description: telegram_user_id привязанного Telegram-аккаунта }
        created_at: { type: string, format: date-time }

    TelegramActingTokenRequest:
      type: object
      description: Тело POST /channels/telegram/token (FR D1, тикет 10.3).
      required: [telegram_user_id]
      properties:
        telegram_user_id:
          type: string
          description: Telegram user id отправителя апдейта (та же строка, что и в ChannelLinkRequest).

    TelegramActingToken:
      type: object
      description: >-
        Короткоживущий access-JWT, действующий от имени пользователя, к
        которому привязан telegram_user_id (FR D1, тикет 10.3). Тот же формат
        и TTL, что и access-токен POST /auth/login (FR A3) — используется
        боту как Bearer в дальнейших вызовах единого API.
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
