# Конфигурация oapi-codegen (v2.4.1): генерация Go-моделей/типов из контракта.
#
# Назначение (бизнес): контракт api/openapi.yaml — единственный источник правды
# для типов запросов/ответов оркестратора (AGENTS.md §0 п.5, §3 OpenAPI). Ручное
# дублирование DTO запрещено — типы генерятся, чтобы Go-сервер не расходился с API.
#
# Как устроено (тех): только models (схемы + параметры). Серверный интерфейс
# (chi-server) генерится отдельным конфигом oapi-codegen.server.yaml в тот же
# пакет `api`. Заголовок "Code generated ... DO NOT EDIT." добавляется
# автоматически — golangci-lint v2 исключает такие файлы из revive/godot.
#
# ВНИМАНИЕ: пути output/input заданы относительно КОРНЯ репозитория — конфиг
# рассчитан на запуск из корня (цель `make generate`), а не из каталога api/.
package: api
output: orchestrator/internal/api/types.gen.go
generate:
  models: true
output-options:
  # Префикс-комментарий идёт перед стандартным "DO NOT EDIT"-заголовком.
  user-templates: {}
