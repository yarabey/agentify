# Конфигурация pre-commit для монорепо agentify.
#
# Назначение: ловить ошибки форматирования и линта документации до коммита,
# поддерживая дисциплину AGENTS.md (§3, §7). Установка: `pip install pre-commit`
# затем `pre-commit install`.
#
# Примечание: хук golangci-lint опирается на локально установленный бинарь
# (`make tools`), а не на сетевую загрузку, чтобы работать за прокси.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
