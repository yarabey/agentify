# Конфигурация golangci-lint (схема v2) для монорепо agentify.
#
# Назначение: включить линтеры документации (AGENTS.md §3) — revive (требует
# godoc на экспортируемых символах + комментарии пакетов) и godot (комментарии
# заканчиваются точкой), плюс базовый набор для качества Go-кода.
#
# Отклонение: отдельный линтер `godoclint`, упомянутый в AGENTS.md §3 и тикете
# 0.1, в golangci-lint отсутствует в реестре линтеров (проверено в v1.64.8 и
# v2.5.0). Покрытие godoc обеспечивается revive (правила exported /
# package-comments) и godot. Когда godoclint станет доступен (или появится
# make docs-check в тикете 0.7), он будет добавлен сюда.
#
# Схема — v2 (golangci-lint >= 2.x); ключ version обязателен.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # В v2 вместо disable-all используется default: none.
  default: none
  enable:
    # --- линтеры документации (требование AGENTS.md §3) ---
    - revive # godoc на экспортируемых символах, комментарии пакетов
    - godot # комментарии заканчиваются точкой
    # --- базовое качество ---
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell

  settings:
    godot:
      # Проверять godoc-комментарии ко всем декларациям, а не только верхнего уровня.
      scope: declarations
      capital: false
    revive:
      # Включаем правила, требующие документацию (AGENTS.md §3).
      rules:
        - name: exported
          severity: error
          disabled: false
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
          severity: error
          disabled: false
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: indent-error-flow
        - name: var-declaration

  exclusions:
    # Не маскировать дефолтными исключениями наши требования к godoc.
    # (В v2 пресет "comments" гасил бы часть revive/godot — не включаем его.)
    presets: []
    rules: []
