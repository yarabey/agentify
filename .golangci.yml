# Конфигурация golangci-lint для монорепо agentify.
#
# Назначение: включить линтеры документации (AGENTS.md §3) — revive (требует
# godoc на экспортируемых символах) и godot (комментарии заканчиваются точкой),
# плюс базовый набор для качества Go-кода.
#
# Отклонение: отдельный линтер `godoclint`, упомянутый в AGENTS.md §3 и тикете
# 0.1, в golangci-lint v1.64.8 ОТСУТСТВУЕТ в реестре линтеров. Покрытие godoc
# обеспечивается revive (правила exported/package-comments) и godot. Когда
# godoclint станет доступен (или появится make docs-check в тикете 0.7), он
# будет добавлен сюда.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    # --- линтеры документации (требование AGENTS.md §3) ---
    - revive # godoc на экспортируемых символах, комментарии пакетов
    - godot # комментарии заканчиваются точкой
    # --- базовое качество ---
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell

linters-settings:
  godot:
    # Проверять godoc-комментарии ко всем декларациям, а не только верхнего уровня.
    scope: declarations
    capital: false
  revive:
    # Включаем правила, требующие документацию (AGENTS.md §3).
    rules:
      - name: exported
        severity: error
        disabled: false
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters
      - name: package-comments
        severity: error
        disabled: false
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-naming
      - name: if-return
      - name: indent-error-flow
      - name: var-declaration

issues:
  # Не маскировать дефолтным excludes наши требования к godoc.
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
